trigger:
  branches:
    include: [main]
pr: none
stages:
- stage: Build
  jobs:
  - job: Product
    pool:
      name: Atlas-Build
      demands: [Agent.Name -equals atlas-mac16-build]
    steps:
    - checkout: self
      clean: true
    - bash: |
        set -euo pipefail
        export PATH="/opt/homebrew/opt/node@24/bin:/opt/homebrew/opt/dotnet@10/bin:/opt/homebrew/bin:/usr/bin:/bin:$PATH"
        export DOTNET_ROOT=/opt/homebrew/opt/dotnet@10/libexec
        export DOCKER_CONTEXT=colima-atlas-build
        OUT="$BUILD_ARTIFACTSTAGINGDIRECTORY/atlas-release"
        mkdir -p "$OUT"
        dotnet publish apps/Atlas.Api/Atlas.Api.csproj -c Release --no-self-contained -o "$OUT/api"
        dotnet publish apps/Atlas.Worker/Atlas.Worker.csproj -c Release --no-self-contained -o "$OUT/worker"
        cd apps/web
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
        cp -R dist "$OUT/web"
        cd ../..
        cp scripts/fast/* "$OUT/"
        cp -R deploy "$OUT/deploy"
        mkdir -p "$OUT/scripts"
        cp -R scripts/restore "$OUT/scripts/restore"
      displayName: Build API, worker and web
    - publish: $(Build.ArtifactStagingDirectory)/atlas-release
      artifact: atlas-release
- stage: DeployMac8
  jobs:
  - job: Deploy
    pool:
      name: Default
      demands: [Agent.Name -equals mac-mini-m1-deploy]
    steps:
    - checkout: none
    - download: current
      artifact: atlas-release
    - bash: /usr/bin/python3 "$PIPELINE_WORKSPACE/atlas-release/deploy.py" "$PIPELINE_WORKSPACE/atlas-release" "$BUILD_BUILDID"
      displayName: Deploy product and check web/API availability
