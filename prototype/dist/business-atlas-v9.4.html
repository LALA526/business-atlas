  function decisionChangeForm(api, task) {

  }
  function deliveryForm() {
    return `<p class="muted">这里只记录模拟实现和测试。不会连接真实仓库、测试执行器或部署平台。</p><label>模拟实现版本 *<input id="v93-delivery-code" placeholder="例如 commit-sim-001"></label><label>模拟测试说明 *<textarea id="v93-delivery-test" placeholder="记录模拟覆盖了哪些正例、反例、边界和回归；不是实际执行日志"></textarea></label><label>模拟部署版本（可选）<input id="v93-delivery-deployment" placeholder="deployment-sim-001"></label>`;
  }
  return { readingWorkbench, taskDetail, newTaskForm, decisionChangeForm, deliveryForm, decisionCard, caseSimulator, evaluationResult, flowExplanation, deliveryPanel };
});

      if (action === 'edit-rule') { const rule = Access.readEntity(m, readContext(), id).data, version = C.ruleVersion(rule); return modal('编辑业务规则', `<label>规则名称<input id="rule-name" value="${esc(rule.name)}"></label><label>适用范围<textarea id="rule-scope">${esc(version?.scope || '')}</textarea></label><label>业务目的<textarea id="rule-purpose">${esc(version?.businessPurpose || version?.summary || rule.description)}</textarea></label><label>默认结果（可选）<input id="rule-default" value="${esc(version?.defaultOutcome || '')}" placeholder="未命中时的结果 ID；留空表示未知"></label><p class="muted">条件行与结果保持原定义。复杂条件变化请通过“提出业务变化”形成候选并审批。</p>`, button('取消', 'close') + button('保存规则草稿', 'save-rule', 'primary', `data-id="${id}"`), true); }
      if (action === 'save-rule') { const rule = Access.readEntity(m, readContext(), id).data, version = clone(C.ruleVersion(rule)); version.scope = $('#rule-scope').value.trim(); version.businessPurpose = $('#rule-purpose').value.trim(); version.summary = version.businessPurpose; version.defaultOutcome = $('#rule-default').value.trim() || null; C.execute(m, 'DefineRule', { entityId: id, name: $('#rule-name').value.trim(), description: rule.description, scope: version.scope, definition: version }, readContext()); save(); closeModal(); go('changes'); return; }
      if (action === 'attach-evidence') return modal('补充来源', '<label>资料名称<input id="evidence-name"></label><label>精确定位<input id="evidence-locator" placeholder="文件、章节、行号或测试名称"></label><label>来源版本<input id="evidence-version" placeholder="文档版本或代码修订"></label><label>可信状态<select id="evidence-trust"><option value="unverified">待核验</option><option value="confirmed">已由 Owner 确认</option></select></label>', button('取消', 'close') + button('保存来源', 'save-evidence', 'primary', `data-id="${id}"`));
      if (action === 'save-evidence') { const trust = $('#evidence-trust').value; if (trust === 'confirmed') W.assert(readContext(), 'decision:approve'); C.execute(m, 'AttachEvidence', { targetId: id, name: $('#evidence-name').value.trim(), resourceType: 'document', sourceVersion: $('#evidence-version').value.trim(), uri: `atlas://${m.meta.id}/manual/${Date.now()}`, locator: $('#evidence-locator').value.trim(), summary: '人工补充的来源定位', trust, confirmedBy: trust === 'confirmed' ? '业务 Owner' : '' }, readContext()); save(); closeModal(); go('changes'); return; }
      if (action === 'create-task') return createTask(element.dataset.root || c.rootId);
      if (action === 'save-task') { const result = Task.createChangeTask(m, readContext(), { rootId: $('#v93-task-root').value || null, description: $('#v93-task-description').value, taskType: $('#v93-task-type').value, sourceRefs: $('#v93-task-source').value.trim() ? [{ kind: 'human_confirmation', resourceId: `HUMAN-${Date.now()}`, locator: $('#v93-task-source').value.trim(), confirmedBy: '需求提出人' }] : [] }); if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); c.selectedTaskId = result.task.id; save(); closeModal(); go('tasks'); return toast(result.task.deliveryState === 'clarification-required' ? '已保存为待澄清需求' : '已保存需求'); }
      if (action === 'propose-v93-decision') return proposeDecision(element.dataset.task);
      if (action === 'save-v93-decision') {
        const inputId = $('#v93-condition-input')?.value.trim(), op = $('#v93-condition-op')?.value, rawValue = $('#v93-condition-value')?.value.trim(), narrative = $('#v93-change-narrative')?.value.trim();
        if (!narrative) return toast('请填写候选目标说明', 'error');
        if (inputId && (!$('#v93-condition-label').value.trim() || !$('#v93-condition-meaning').value.trim())) return toast('新增输入必须说明业务名称和业务含义', 'error');
        const condition = inputId ? { op, inputId, ...(op === 'in' ? { values: rawValue.split(/[,，]/).map(value => value.trim()).filter(Boolean) } : !['exists', 'notExists'].includes(op) ? { value: rawValue === 'true' ? true : rawValue === 'false' ? false : rawValue } : {}), ...(['contains', 'startsWith'].includes(op) ? { caseSensitive: false, nullHandling: 'not-match' } : {}) } : null;
        const result = Task.proposeDecisionChange(m, readContext(), element.dataset.task, { ruleId: $('#v93-change-rule')?.value, rowId: $('#v93-change-row')?.value, condition, inputSemantics: inputId ? { label: $('#v93-condition-label').value.trim(), businessMeaning: $('#v93-condition-meaning').value.trim(), kind: 'string' } : null, outcomeId: $('#v93-change-outcome')?.value, naturalLanguage: narrative, targetBehavior: narrative, recommendationReason: $('#v93-change-reason')?.value.trim() });
        if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); save(); closeModal(); go('tasks'); return toast('候选已保存，尚未批准');
      }
      if (action === 'approve-v93-decision') return decideDecision(element.dataset.task, element.dataset.proposal, 'approved');
      if (action === 'reject-v93-decision') return decideDecision(element.dataset.task, element.dataset.proposal, 'rejected');
      if (action === 'confirm-v93-decision') { const result = Task.decideBusinessChange(m, readContext(), element.dataset.task, element.dataset.proposal, { decision: element.dataset.decision, by: $('#decision-by').value.trim(), rationale: $('#decision-rationale').value.trim() }); if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); save(); closeModal(); if (result.draftCreated) { go('changes'); return toast('批准已记录，知识草稿已形成；请提交并发布 Change Set'); } go('tasks'); return toast('候选已拒绝，未创建知识草稿'); }
      if (action === 'record-v93-delivery') return modal('记录模拟开发与测试', UI.deliveryForm(), button('取消', 'close') + button('保存模拟记录', 'save-v93-delivery', 'primary', `data-task="${element.dataset.task}"`));
      if (action === 'save-v93-delivery') { const result = Task.attachSimulatedDelivery(m, readContext(), element.dataset.task, { codeRevision: $('#v93-delivery-code').value.trim(), testCommand: $('#v93-delivery-test').value.trim(), deploymentVersion: $('#v93-delivery-deployment').value.trim() }); if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); save(); closeModal(); go('contracts'); return toast('模拟交付已保存，知识批准状态未被覆盖'); }
      if (action === 'save-v93-impact') { const article = element.closest('[data-impact]'), result = Task.recordImpactDecision(m, readContext(), element.dataset.task, element.dataset.impact, { status: $('[data-impact-status]', article).value, completion: $('[data-impact-completion]', article).value, rationale: $('[data-impact-rationale]', article).value, deferredTaskId: $('[data-impact-deferred]', article)?.value || '' }); if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); save(); render(); return toast('影响结论已保存'); }
      if (action === 'review-v93-legacy') return modal('记录旧路径人工检查', '<p class="muted">原型没有自动完成代码调查，请记录人工检查范围、依据和未覆盖部分。</p><label>调查依据 *<textarea id="legacy-rationale" placeholder="检查了哪些调用方、旧路径、兼容和重复实现；还有哪些未确认"></textarea></label>', button('取消', 'close') + button('保存人工检查', 'save-v93-legacy', 'primary', `data-task="${element.dataset.task}"`));
      if (action === 'save-v93-legacy') { const result = Task.recordLegacyPathReview(m, readContext(), element.dataset.task, { rationale: $('#legacy-rationale').value.trim() }); if (!result.ok) return toast((result.errors || [result.code]).join('；'), 'error'); save(); closeModal(); go('tasks'); return; }
      if (action === 'generate-task-contract') { const task = m.tasks.find(item => item.id === element.dataset.task), pack = task.activeContractId && task.status === 'needs-review' ? P.reviewTask(m, task.id, { context: readContext(), permission: permission(), applicableContext: c.applicableContext, applicabilityMode: c.applicabilityMode }) : P.generateFormalContract(m, { taskId: task.id, rootId: task.rootId, baselineId: m.versionLayers.baseline, permission: permission(), context: readContext(), applicableContext: c.applicableContext, applicabilityMode: c.applicabilityMode, purpose: task.purpose, taskIntent: task.title }); if (!pack.ok) return toast((pack.errors || [pack.code]).join('；'), 'error'); task.deliveryState = Task.evaluateDelivery(m, readContext(), task.id).state; save(); go('contracts'); return toast('正式知识契约已按当前基线复核'); }
      if (action === 'complete-v93-task') { const result = Task.completeTask(m, readContext(), element.dataset.task, { by: '验收 Owner', result: '通过', evidence: '模拟任务内部规则验收' }); if (!result.ok) return modal('尚不能完成', `<p>以下事项仍需处理：</p>${result.errors.map(error => `<p>• ${esc(error)}</p>`).join('')}`, button('返回', 'close'), true); save(); render(); return toast('模拟任务已完成内部验收'); }
      if (action === 'export-v93-task') { const exported = Task.exportTaskContract(m, readContext(), element.dataset.task); if (!exported.ok) return toast('当前角色不能导出任务记录', 'error'); download(`${element.dataset.task}-record.json`, JSON.stringify(exported.data, null, 2)); return; }
      if (action === 'submit-changeset') { const ws = m.draftWorkspace; ws.title = $('#cs-title').value.trim() || ws.title; ws.reason = $('#cs-reason').value.trim(); const result = C.execute(m, 'ProposeChange', { reason: ws.reason, title: ws.title }, readContext()); if (!result.ok) return toast(result.errors.join('；'), 'error'); save(); render(); return toast('变更已提交审核'); }
      if (action === 'publish-changeset') { const result = C.execute(m, 'PublishRevision', { confirmedBy: $('#cs-confirmer').value.trim() }, readContext()); if (!result.ok) return toast(result.errors.join('；'), 'error'); c.baselineId = result.baseline.id; c.versionMode = 'published'; save(); render(); return toast(`${result.baseline.id} 已发布；请复核关联任务契约后验收`); }
      if (action === 'create-feedback') return modal('提交反馈', '<label>类型<select id="feedback-category"><option value="business-correction">业务知识纠错</option><option value="technical-correction">技术映射纠错</option><option value="knowledge-gap">知识缺口</option><option value="system-defect">系统缺陷</option><option value="capability-request">能力建议</option></select></label><label>反馈内容<textarea id="feedback-description"></textarea></label>', button('取消', 'close') + button('提交', 'save-feedback', 'primary'));
      if (action === 'save-feedback') { const description = $('#feedback-description').value.trim(); if (!description) return toast('反馈不能为空', 'error'); Services.createFeedback(m, { category: $('#feedback-category').value, title: description.slice(0, 42), description, relatedKnowledgeIds: c.rootId ? [c.rootId] : [], context: readContext() }); save(); closeModal(); go('tasks'); return toast('反馈已提交'); }
    } catch (error) { console.error(error); toast(error.message, 'error'); }
  }
  document.addEventListener('click', event => {
    const element = event.target.closest('[data-route],[data-action],[data-open-studio],[data-task],[data-issue],[data-collab-tab],[data-flow-stage],[data-v93-case]'); if (!element) return;
    const data = element.dataset, c = Ctx();
    if (data.route) return go(data.route);
    if (data.openStudio) return openStudio(data.openStudio);
    if (data.action && data.action !== 'decide-issue') { handleAction(data.action, element); return; }
    if (data.task) { c.selectedTaskId = data.task; c.collaborationTab = 'tasks'; save(); closeModal(); return go('tasks'); }
    if (data.collabTab) { c.collaborationTab = data.collabTab; save(); return render(); }
    if (data.flowStage !== undefined) { c.flowStageId = data.flowStage || null; save(); return render(); }
    if (data.v93Case) {
      const businessCase = Access.readEntity(M(), readContext(), data.v93Case).data; if (!businessCase) return toast('案例不可读', 'error');
      const ruleId = businessCase.props?.decisionRef?.ruleId; c.v93EvaluationRuleId = ruleId; c.v93EvaluationInputs[ruleId] = clone(businessCase.props.inputs || {}); c.v93EvaluationResults[ruleId] = D.evaluateRule(M(), readContext(), ruleId, businessCase.props.inputs || {}, { version: businessCase.props.decisionRef.version }); c.v93CaseResults[businessCase.id] = D.verifyCase(M(), readContext(), businessCase.id); save(); render(); requestAnimationFrame(() => $('.case-section')?.scrollIntoView({ block: 'start', behavior: 'instant' })); return;
    }
    if (data.issue) {
      const issue = Task.readIssue(M(), readContext(), data.issue).data; if (!issue) return toast('问题不可读', 'error');
      return modal('处理待确认问题', `<h3>${esc(issue.title)}</h3><p>${esc(issue.impact || issue.description)}</p><label>处理决定<select id="issue-action"><option value="maintain">维持原规范</option><option value="change-knowledge">修改知识草稿</option><option value="implementation-task">创建实现修复任务</option><option value="attach-evidence">补充来源</option><option value="pause">暂停执行</option></select></label><label>确认说明<textarea id="issue-decision"></textarea></label>`, button('取消', 'close') + button('记录决定', 'decide-issue', 'primary', `data-id="${issue.id}"`));
    }
    if (data.action === 'decide-issue') { const result = C.decideIssue(M(), data.id, { classification: 'evidence-insufficient', action: $('#issue-action').value, decision: $('#issue-decision').value.trim(), by: '业务 Owner', context: readContext() }); save(); closeModal(); go('tasks'); return result; }
    handleAction(data.action, element);
  });
  document.addEventListener('change', event => {
    const element = event.target, c = Ctx();
    if (element.id === 'app-project') { store.currentProjectId = element.value; Ctx(); save(); return go('home'); }
    if (element.id === 'app-role') { c.role = element.value; c.v93EvaluationResults = {}; c.v93CaseResults = {}; R.clearCache(); Access.touch(M(), 'permission.changed', { role: c.role }); save(); return render(); }
    if (element.id === 'studio-root') return openStudio(element.value);
    if (element.id === 'studio-version') { c.versionMode = element.value; c.baselineId = M().versionLayers.baseline; save(); return render(); }
    if (element.id === 'studio-baseline') { c.baselineId = element.value; c.versionMode = 'published'; save(); return render(); }
    if (element.id === 'catalog-type') { c.catalogType = element.value; save(); return render(); }
    if (element.id === 'v93-eval-rule') { c.v93EvaluationRuleId = element.value; save(); return render(); }
    if (element.dataset.v93EvalInput) { const ruleId = element.dataset.rule; c.v93EvaluationInputs[ruleId] ||= {}; c.v93EvaluationInputs[ruleId][element.dataset.v93EvalInput] = element.value; delete c.v93EvaluationResults[ruleId]; save(); }
  });
  document.addEventListener('input', event => { if (event.target.id === 'catalog-query') { const c = Ctx(); c.catalogQuery = event.target.value; clearTimeout(state.searchTimer); state.searchTimer = setTimeout(() => { save(); render(); const input = $('#catalog-query'); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 150); } });
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action="evaluate-v93-rule"],[data-action="clear-v93-evaluation"]'); if (!button) return;
    const c = Ctx(), ruleId = button.dataset.rule;
    if (button.dataset.action === 'clear-v93-evaluation') { c.v93EvaluationInputs[ruleId] = {}; delete c.v93EvaluationResults[ruleId]; }
    else { const values = { ...(c.v93EvaluationInputs[ruleId] || {}) }; $$('[data-v93-eval-input]', button.closest('.simulator')).forEach(input => { if (input.value !== '' || Object.prototype.hasOwnProperty.call(values, input.dataset.v93EvalInput)) values[input.dataset.v93EvalInput] = input.value; }); c.v93EvaluationInputs[ruleId] = values; c.v93EvaluationResults[ruleId] = D.evaluateRule(M(), readContext(), ruleId, values); }
    save(); render();
  });
  addEventListener('hashchange', () => { const parts = location.hash.slice(1).split('/').filter(Boolean); if (store.projects[parts[0]]) store.currentProjectId = parts[0]; state.route = parts[1] || 'home'; if (state.route === 'studio' && parts[2]) Ctx().rootId = parts[2]; Ctx(); go(state.route); });
  (function init() { const parts = location.hash.slice(1).split('/').filter(Boolean); if (store.projects[parts[0]]) store.currentProjectId = parts[0]; if (parts[1]) state.route = parts[1]; if (state.route === 'studio' && parts[2]) Ctx().rootId = parts[2]; Ctx(); go(state.route); })();
})();
