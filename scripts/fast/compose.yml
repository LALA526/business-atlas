name: atlas-product
services:
  postgres:
    image: postgres:17
    platform: linux/arm64
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f && chmod 600 /wal-archive/%f
      - -c
      - archive_timeout=900
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD}
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
      - ${ATLAS_BACKUP_ROOT:-./backups}/wal:/wal-archive
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atlas -d atlas]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    cpus: 1.0
  backup:
    image: postgres:17
    platform: linux/arm64
    profiles: [tools]
    environment:
      PGPASSWORD: ${ATLAS_DB_PASSWORD}
    volumes:
      - atlas-private-blobs:/blobs:ro
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
  identity:
    image: quay.io/keycloak/keycloak:26.4
    platform: linux/arm64
    restart: unless-stopped
    command:
      - start
      - --proxy-headers=xforwarded
      - --hostname=${ATLAS_AUTHORITY}
      - --hostname-strict=true
      - --http-enabled=true
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: atlas-keycloak-admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1024m
    cpus: 1.5
  migrate:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    platform: linux/arm64
    profiles: [tools]
    working_dir: /app
    command: [dotnet, Atlas.Api.dll, --migrate-only]
    environment:
      ConnectionStrings__Atlas: Host=postgres;Port=5432;Database=atlas;Username=atlas;Password=${ATLAS_DB_PASSWORD}
    volumes: [./api:/app:ro]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
  api:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    platform: linux/arm64
    restart: unless-stopped
    working_dir: /app
    command: [dotnet, Atlas.Api.dll]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Atlas: Host=postgres;Port=5432;Database=atlas;Username=atlas_runtime;Password=${ATLAS_RUNTIME_PASSWORD}
      Authentication__DataProtectionKeyPath: /var/lib/atlas/keys
      Authentication__AllowInsecureLanPreview: "false"
      Authentication__AllowInsecureInternalMetadata: "true"
      Authentication__Oidc__Authority: ${ATLAS_AUTHORITY}
      Authentication__Oidc__MetadataAddress: http://identity:8080/realms/atlas/.well-known/openid-configuration
      Authentication__Oidc__ClientId: atlas-web
      Authentication__Oidc__ClientSecret: ${ATLAS_OIDC_CLIENT_SECRET}
      Authentication__Oidc__CallbackOrigin: ${ATLAS_BASE_URL}
      Authentication__Bearer__Authority: ${ATLAS_AUTHORITY}
      Authentication__Bearer__MetadataAddress: http://identity:8080/realms/atlas/.well-known/openid-configuration
      Authentication__Bearer__Audience: business-atlas-api
      ImportEvidence__PrivateBlobRoot: /var/lib/atlas/blobs
      ReadSearchExplain__CursorKey: ${ATLAS_CURSOR_KEY}
    volumes:
      - ./api:/app:ro
      - atlas-keys:/var/lib/atlas/keys
      - atlas-private-blobs:/var/lib/atlas/blobs
    depends_on:
      postgres: {condition: service_healthy}
      identity: {condition: service_started}
    mem_limit: 512m
    cpus: 1.5
  worker:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    platform: linux/arm64
    restart: unless-stopped
    working_dir: /app
    command: [dotnet, Atlas.Worker.dll]
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Atlas: Host=postgres;Port=5432;Database=atlas;Username=atlas_background;Password=${ATLAS_WORKER_PASSWORD}
      ReadSearchExplain__CursorKey: ${ATLAS_CURSOR_KEY}
    volumes: [./worker:/app:ro]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.75
  web:
    image: caddy:2-alpine
    platform: linux/arm64
    restart: unless-stopped
    ports: [15809:8443]
    volumes:
      - ./web:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
    depends_on: [api, identity]
    mem_limit: 128m
    cpus: 0.5
volumes:
  atlas-postgres:
  atlas-keys:
  atlas-private-blobs:
