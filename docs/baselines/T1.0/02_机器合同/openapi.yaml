          $ref: '#/components/responses/HttpError404'
        '409':
          $ref: '#/components/responses/HttpError409'
        '412':
          $ref: '#/components/responses/HttpError412'
        '422':
          $ref: '#/components/responses/HttpError422'
        '428':
          $ref: '#/components/responses/HttpError428'
        '429':
          $ref: '#/components/responses/HttpError429'
        '503':
          $ref: '#/components/responses/HttpError503'
        '200':
          description: 依赖就绪，无敏感信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: OK
                  requestId:
                    type: string
                    minLength: 1
                  traceId:
                    type: string
                  context:
                    $ref: '#/components/schemas/ResolvedContext'
                  data:
                    $ref: '#/components/schemas/Health'
                required:
                - code
                - requestId
                - data
                additionalProperties: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: atlas_session
      description: BFF human session. Mutating requests require server-issued CSRF token.
  schemas:
    UnitRef:
      type: object
      properties:
        unitId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
      required:
      - unitId
      additionalProperties: false
    RevisionRef:
      type: object
      properties:
        unitId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
      required:
      - unitId
      - revisionId
      additionalProperties: false
    SourceLocator:
      type: object
      properties:
        kind:
          type: string
          enum:
          - file
          - git
          - url
          - test
          - human
          - document
        path:
          type: string
        repo:
          type: string
        commitSha:
          type: string
          pattern: ^[0-9a-f]{40,64}$
        blobSha:
          type: string
          pattern: ^[0-9a-f]{40,64}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        lineStart:
          type: integer
          minimum: 1
        lineEnd:
          type: integer
          minimum: 1
        page:
          type: integer
          minimum: 1
        uri:
          type: string
        quote:
          type: string
        description:
          type: string
      required:
      - kind
      additionalProperties: false
    EvidenceRef:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/RevisionRef'
        locator:
          $ref: '#/components/schemas/SourceLocator'
        support:
          type: string
          enum:
          - supports
          - refutes
          - contextual
        captureKind:
          type: string
          enum:
          - rawCaptured
          - verifiedScript
          - reconstructed
          - proposed
          - humanAttestation
      required:
      - source
      - locator
      - support
      - captureKind
      additionalProperties: false
    Applicability:
      type: object
      properties:
        unrestricted:
          type: boolean
        contexts:
          type: array
          items:
            type: string
            minLength: 1
        organizations:
          type: array
          items:
            type: string
            minLength: 1
        products:
          type: array
          items:
            type: string
            minLength: 1
        environments:
          type: array
          items:
            type: string
            minLength: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        expression:
          $ref: '#/components/schemas/Expr'
      required:
      - unrestricted
      additionalProperties: false
    ApplicableContext:
      type: object
      properties:
        contextKey:
          type: string
        organization:
          type: string
        product:
          type: string
        environment:
          type: string
        asOf:
          type: string
          format: date-time
        facts:
          type: object
          additionalProperties: true
      required: []
      additionalProperties: false
    ReadContext:
      type: object
      properties:
        mode:
          type: string
          enum:
          - published
          - historical
          - draft
        baselineId:
          type: string
          format: uuid
        changeSetId:
          type: string
          format: uuid
        context:
          $ref: '#/components/schemas/ApplicableContext'
        purpose:
          type: string
          enum:
          - understand
          - implement
          - change
          - verify
          - review
          - export
      required:
      - mode
      - purpose
      additionalProperties: false
      allOf:
      - if:
          properties:
            mode:
              const: historical
        then:
          required:
          - baselineId
      - if:
          properties:
            mode:
              const: draft
        then:
          required:
          - changeSetId
    ResolvedContext:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        baselineId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - published
          - historical
          - draft
        changeSetId:
          type: string
          format: uuid
        changeSetVersion:
          type: integer
          minimum: 1
        policyEpoch:
          type: integer
          minimum: 1
        contextHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        asOf:
          type: string
          format: date-time
        purpose:
          type: string
      required:
      - projectId
      - baselineId
      - mode
      - policyEpoch
      - contextHash
      - asOf
      - purpose
      additionalProperties: false
    Unknown:
      type: object
      properties:
        key:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
          - info
          - warning
          - blocking
        reason:
          type: string
          enum:
          - missing
          - conflict
          - insufficient
          - unverified
          - stale
          - not_applicable
          - restricted_context
        nextAction:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/RevisionRef'
      required:
      - key
      - description
      - severity
      - reason
      additionalProperties: false
    ContentBlock:
      type: object
      properties:
        blockId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - paragraph
          - table
          - list
          - notice
        text:
          type: string
        columns:
          type: array
          items:
            type: string
            minLength: 1
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        items:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/RevisionRef'
      required:
      - blockId
      - kind
      - references
      additionalProperties: false
    Operand:
      oneOf:
      - type: object
        properties:
          kind:
            const: field
          attributeId:
            type: string
            format: uuid
        required:
        - kind
        - attributeId
        additionalProperties: false
      - type: object
        properties:
          kind:
            const: literal
          valueType:
            type: string
            enum:
            - string
            - decimal
            - integer
            - boolean
            - date
            - datetime
            - enum
            - 'null'
            - list
          value: {}
        required:
        - kind
        - valueType
        - value
        additionalProperties: false
    Expr:
      oneOf:
      - type: object
        properties:
          op:
            type: string
            enum:
            - exists
            - missing
            - isNull
          operand:
            $ref: '#/components/schemas/Operand'
        required:
        - op
        - operand
        additionalProperties: false
      - type: object
        properties:
          op:
            type: string
            enum:
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - contains
            - startsWith
            - in
          left:
            $ref: '#/components/schemas/Operand'
          right:
            $ref: '#/components/schemas/Operand'
          comparison:
            type: string
            enum:
            - ordinal
            - ordinalIgnoreCase
            - typed
        required:
        - op
        - left
        - right
        - comparison
        additionalProperties: false
      - type: object
        properties:
          op:
            type: string
            enum:
            - all
            - any
          args:
            type: array
            items:
              $ref: '#/components/schemas/Expr'
            minItems: 1
            maxItems: 1000
        required:
        - op
        - args
        additionalProperties: false
      - type: object
        properties:
          op:
            const: not
          arg:
            $ref: '#/components/schemas/Expr'
        required:
        - op
        - arg
        additionalProperties: false
    RuleInput:
      type: object
      properties:
        attribute:
          $ref: '#/components/schemas/UnitRef'
        label:
          type: string
          minLength: 1
        valueType:
          type: string
          enum:
          - string
          - decimal
          - integer
          - boolean
          - date
          - datetime
          - enum
          - list
        unit:
          type: string
        missingSemantics:
          type: string
        nullSemantics:
          type: string
      required:
      - attribute
      - label
      - valueType
      - missingSemantics
      - nullSemantics
      additionalProperties: false
    Outcome:
      type: object
      properties:
        kind:
          type: string
          enum:
          - perform
          - deny
          - skip
          - set_state
          - emit
          - manual
          - unknown
        description:
          type: string
          minLength: 1
        actionRef:
          $ref: '#/components/schemas/UnitRef'
        stateRef:
          $ref: '#/components/schemas/UnitRef'
        value: {}
      required:
      - kind
      - description
      additionalProperties: false
    DecisionRow:
      type: object
      properties:
        rowId:
          type: string
          minLength: 1
        situation:
          type: string
          minLength: 1
        comparisonExplanation:
          type: string
          minLength: 1
        when:
          $ref: '#/components/schemas/Expr'
        priority:
          type: integer
          minimum: 0
        outcome:
          $ref: '#/components/schemas/Outcome'
        otherwise:
          $ref: '#/components/schemas/Outcome'
        evidenceRefs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required:
      - rowId
      - situation
      - comparisonExplanation
      - outcome
      - evidenceRefs
      additionalProperties: false
    RuleBody:
      type: object
      properties:
        purpose:
          type: string
          minLength: 1
        evaluationMode:
          type: string
          enum:
          - structured
          - human_only
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/RuleInput'
        priorityPolicy:
          type: string
          enum:
          - unique
          - ordered
          - collect
        collectOperator:
          type: string
          enum:
          - set_union
          - ordered_list
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DecisionRow'
          minItems: 1
        defaultOutcome:
          $ref: '#/components/schemas/Outcome'
        exceptionExplanation:
          type: string
        caseRefs:
          type: array
          items:
            $ref: '#/components/schemas/UnitRef'
      required:
      - purpose
      - evaluationMode
      - inputs
      - priorityPolicy
      - rows
      - exceptionExplanation
      - caseRefs
      additionalProperties: false
      allOf:
      - if:
          properties:
            evaluationMode:
              const: structured
        then:
          properties:
            rows:
              items:
                required:
                - when
      - if:
          properties:
            priorityPolicy:
              const: collect
        then:
          required:
          - collectOperator
      - if:
          properties:
            priorityPolicy:
              const: ordered
        then:
          properties:
            rows:
              items:
                required:
                - priority
    TermBody:
