          - exception
        title:
          type: string
          minLength: 1
        action:
          $ref: '#/components/schemas/UnitRef'
        actor:
          $ref: '#/components/schemas/UnitRef'
        ruleRefs:
          type: array
          items:
            $ref: '#/components/schemas/UnitRef'
        result:
          type: string
      required:
      - nodeId
      - stageId
      - kind
      - title
      - ruleRefs
